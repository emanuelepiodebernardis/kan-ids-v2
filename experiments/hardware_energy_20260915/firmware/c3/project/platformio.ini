[platformio]
default_envs = esp32c3_fnb58_coeff_pilot, esp32c3_fnb58_lut_pilot, esp32c3_fnb58_mlp_pilot, esp32c3_fnb58_kanml_pilot, esp32c3_fnb58_dt5_pilot

[env]
platform = platformio/espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
board_build.f_cpu = 160000000L
board_upload.before_reset = usb_reset
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 0
build_unflags = -O0 -O1 -O2 -O3 -Og -flto
build_flags = -Os -fno-lto -fno-jump-tables -fno-tree-switch-conversion -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DPILOT_LED_GPIO=8 -DPILOT_LED_ACTIVE_LOW=1
build_src_filter = +<main.cpp>

[env:esp32c3_fnb58_coeff_pilot]
build_flags = ${env.build_flags} -DHB_COEFF

[env:esp32c3_fnb58_lut_pilot]
build_flags = ${env.build_flags} -DHB_LUT14

[env:esp32c3_fnb58_mlp_pilot]
build_flags = ${env.build_flags} -DHB_MLP

[env:esp32c3_fnb58_kanml_pilot]
build_flags = ${env.build_flags} -DHB_MLCOEFF

[env:esp32c3_fnb58_dt5_pilot]
build_flags = ${env.build_flags} -DHB_DT5
