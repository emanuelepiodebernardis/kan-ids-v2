[platformio]
default_envs = mega_500_coeff, mega_500_lut, mega_500_mlp, mega_500_kanml, mega_500_dt5, c3_500_coeff, c3_500_lut, c3_500_mlp, c3_500_kanml, c3_500_dt5

[env]
framework = arduino
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_unflags = -O0 -O1 -O2 -O3 -Og -flto
build_flags = -Os -fno-lto
extra_scripts = post:save_build_artifacts.py

[mega]
platform = platformio/atmelavr@5.1.0
board = megaatmega2560
platform_packages =
    platformio/framework-arduino-avr@5.2.0
    platformio/toolchain-atmelavr@1.70300.191015
    platformio/tool-avrdude@1.60300.200527
board_build.f_cpu = 16000000L
upload_speed = 115200
build_flags = ${env.build_flags} -DHW500_MEGA

[c3]
platform = platformio/espressif32@6.12.0
board = esp32-c3-devkitm-1
platform_packages = platformio/framework-arduinoespressif32@3.20017.241212
board_build.f_cpu = 160000000L
board_upload.before_reset = usb_reset
monitor_dtr = 1
monitor_rts = 0
build_flags = ${env.build_flags} -fno-jump-tables -fno-tree-switch-conversion -DHW500_C3 -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

[env:mega_500_coeff]
extends = mega
build_flags = ${mega.build_flags} -DHB_COEFF

[env:mega_500_lut]
extends = mega
build_flags = ${mega.build_flags} -DHB_LUT14

[env:mega_500_mlp]
extends = mega
build_flags = ${mega.build_flags} -DHB_MLP

[env:mega_500_kanml]
extends = mega
build_flags = ${mega.build_flags} -DHB_MLCOEFF

[env:mega_500_dt5]
extends = mega
build_flags = ${mega.build_flags} -DHB_DT5

[env:c3_500_coeff]
extends = c3
build_flags = ${c3.build_flags} -DHB_COEFF

[env:c3_500_lut]
extends = c3
build_flags = ${c3.build_flags} -DHB_LUT14

[env:c3_500_mlp]
extends = c3
build_flags = ${c3.build_flags} -DHB_MLP

[env:c3_500_kanml]
extends = c3
build_flags = ${c3.build_flags} -DHB_MLCOEFF

[env:c3_500_dt5]
extends = c3
build_flags = ${c3.build_flags} -DHB_DT5

