; platformio.ini — benchmark KAN-IDS (integer-only)
; =================================================
; Due environment, gli stessi target del paper (Electronics 2026, 15, 2869):
;   - megaatmega2560 : Arduino Mega 2560 (AVR, framework arduino)
;   - esp32c3        : ESP32-C3-DevKitM-1 (framework arduino)
;
; Sorgente UNICO: src/main.cpp (le differenze di target sono gestite via
; #ifdef __AVR__ / ARDUINO_ARCH_ESP32). Gli header del modello e dei test
; vector sono in include/ (copie NON modificate di quelli in ../mcu/).
;
; Uso rapido:
;   pio run -e megaatmega2560                 # compila per il Mega
;   pio run -e esp32c3                        # compila per l'ESP32-C3
;   pio run -e megaatmega2560 -t upload       # flash
;   pio device monitor -e megaatmega2560      # legge il CSV su seriale
;
; Energia (opzionale): scommenta il build_flag ENABLE_INA219 nell'env.

[platformio]
default_envs = megaatmega2560, esp32c3
src_dir = src
include_dir = include

; ---- opzioni comuni ----
[env]
monitor_speed = 115200
build_flags =
    -Iinclude
; Per abilitare la misura di energia via INA219, aggiungi in un env:
;   -DENABLE_INA219

; ---- Arduino Mega 2560 (AVR ATmega2560) ----
[env:megaatmega2560]
build_src_filter = +<main.cpp>
platform = atmelavr
board = megaatmega2560
framework = arduino
; SRAM totale 8 KB: il firmware usa statistiche in streaming (niente buffer
; da 500) e soli 2 array di indici int8 -> footprint minimo.
build_flags =
    ${env.build_flags}
    -Os
; Per energia:
; build_flags = ${env.build_flags} -Os -DENABLE_INA219

; ---- ESP32-C3-DevKitM-1 ----
[env:esp32c3]
build_src_filter = +<main.cpp>
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    ${env.build_flags}
    -O2
; Per energia:
; build_flags = ${env.build_flags} -O2 -DENABLE_INA219


; --- terza variante di compilazione: coefficienti B-spline full-integer (246 B) ---
[env:megaatmega2560_coeff]
extends = env:megaatmega2560
build_src_filter = +<main_coeff.cpp>

[env:esp32c3_coeff]
extends = env:esp32c3
build_src_filter = +<main_coeff.cpp>

[env:megaatmega2560_mlcoeff]
extends = env:megaatmega2560
build_src_filter = +<main_mlcoeff.cpp>

[env:esp32c3_mlcoeff]
extends = env:esp32c3
build_src_filter = +<main_mlcoeff.cpp>

[env:esp32c3_mc]
extends = env:esp32c3
build_src_filter = +<main_mc.cpp>
