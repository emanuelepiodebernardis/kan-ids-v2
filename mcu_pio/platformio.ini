; platformio.ini — benchmark KAN-IDS (integer-only)
; =================================================
; Due environment, gli stessi target del paper (Electronics 2026, 15, 2869):
;   - megaatmega2560 : Arduino Mega 2560 (AVR, framework arduino)
;   - esp32c3        : ESP32-C3-DevKitM-1 (framework arduino)
;
; Sorgente UNICO: src/main.cpp (le differenze di target sono gestite via
; #ifdef __AVR__ / ARDUINO_ARCH_ESP32). Gli header del modello e dei test
; vector sono in include/ (copie NON modificate di quelli in ../mcu/).
;
; Uso rapido:
;   pio run -e megaatmega2560                 # compila per il Mega
;   pio run -e esp32c3                        # compila per l'ESP32-C3
;   pio run -e megaatmega2560 -t upload       # flash
;   pio device monitor -e megaatmega2560      # legge il CSV su seriale
;
; Energia (opzionale): scommenta il build_flag ENABLE_INA219 nell'env.

[platformio]
default_envs = megaatmega2560, esp32c3
src_dir = src
include_dir = include

; ---- opzioni comuni ----
[env]
monitor_speed = 115200
build_flags =
    -Iinclude
; Per abilitare la misura di energia via INA219, aggiungi in un env:
;   -DENABLE_INA219

; ---- Arduino Mega 2560 (AVR ATmega2560) ----
[env:megaatmega2560]
build_src_filter = +<main.cpp>
platform = atmelavr
board = megaatmega2560
framework = arduino
; SRAM totale 8 KB: il firmware usa statistiche in streaming (niente buffer
; da 500) e soli 2 array di indici int8 -> footprint minimo.
build_flags =
    ${env.build_flags}
    -Os
; Per energia:
; build_flags = ${env.build_flags} -Os -DENABLE_INA219

; ---- ESP32-C3-DevKitM-1 ----
[env:esp32c3]
build_src_filter = +<main.cpp>
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
    ${env.build_flags}
    -O2
; Per energia:
; build_flags = ${env.build_flags} -O2 -DENABLE_INA219


; --- terza variante di compilazione: coefficienti B-spline full-integer (254 B) ---
[env:megaatmega2560_coeff]
extends = env:megaatmega2560
build_src_filter = +<main_coeff.cpp>

[env:esp32c3_coeff]
extends = env:esp32c3
build_src_filter = +<main_coeff.cpp>

[env:megaatmega2560_mlcoeff]
extends = env:megaatmega2560
build_src_filter = +<main_mlcoeff.cpp>

[env:esp32c3_mlcoeff]
extends = env:esp32c3
build_src_filter = +<main_mlcoeff.cpp>

[env:esp32c3_mc]
extends = env:esp32c3
build_src_filter = +<main_mc.cpp>


; --- pipeline INTEGER-ONLY END-TO-END: dai contatori grezzi alla decisione ---
; A differenza delle altre varianti non riceve vettori pre-normalizzati:
; il feature engineering gira a bordo, sempre in aritmetica intera.
[env:megaatmega2560_e2e]
extends = env:megaatmega2560
build_src_filter = +<main_e2e.cpp>

[env:esp32c3_e2e]
extends = env:esp32c3
build_src_filter = +<main_e2e.cpp>


; --- Decision Tree profondo 5: il concorrente diretto sul Pareto ---
[env:megaatmega2560_dt5]
extends = env:megaatmega2560
build_src_filter = +<main_dt5.cpp>

[env:esp32c3_dt5]
extends = env:esp32c3
build_src_filter = +<main_dt5.cpp>

; --- MLP piccolo (16 nascosti, ReLU) integer: la baseline densa ---
; Chiude il confronto DT / MLP / KAN-1L / KAN-ML / LUT sul dispositivo: era
; l'unico dei cinque a esistere solo come stima di byte.
; --- KAN single-layer campionata (sampled-LUT, 5.194 B): stesso modello dei
; --- 254 B, altra rappresentazione. Serve al confronto LUT vs coefficienti.
[env:megaatmega2560_lut14]
extends = env:megaatmega2560
build_src_filter = +<main_lut14.cpp>

[env:esp32c3_lut14]
extends = env:esp32c3
build_src_filter = +<main_lut14.cpp>

[env:megaatmega2560_mlp]
extends = env:megaatmega2560
build_src_filter = +<main_mlp.cpp>

[env:esp32c3_mlp]
extends = env:esp32c3
build_src_filter = +<main_mlp.cpp>

; --- catena integer end-to-end a 10 classi (21,7 KB: solo ESP32-C3) ---
[env:esp32c3_mc_e2e]
extends = env:esp32c3
build_src_filter = +<main_mc_e2e.cpp>

; ─────────────────────────────────────────────────────────────────────
; BENCHMARK DI ENERGIA (src/main_energy.cpp)
;
; Firmware separato da quelli di latenza: una finestra lunga di sole
; inferenze, marcata su un pin, seguita da una finestra di riferimento
; della stessa durata con la CPU a vuoto. Nessuna Serial e nessun I2C
; dentro le finestre. Vedi l'intestazione di src/main_energy.cpp.
;
; Il pin di marcatura (22 sul Mega, GPIO 3 sull'ESP32-C3) va collegato solo
; all'ingresso di trigger dello strumento. NON e' il pin del LED di bordo:
; il LED assorbirebbe corrente dentro la misura.
;
; Una variante per volta. Batch e ripetizioni si cambiano da riga di
; comando senza toccare il file:
;   pio run -e megaatmega2560_energy -t upload
;   PLATFORMIO_BUILD_FLAGS="-DEB_BATCH=5000 -DEB_REPS=10" pio run -e esp32c3_energy
; ─────────────────────────────────────────────────────────────────────

[env:megaatmega2560_energy]
extends = env:megaatmega2560
build_src_filter = +<main_energy.cpp>
build_flags = ${env:megaatmega2560.build_flags} -DEB_COEFF

[env:esp32c3_energy]
extends = env:esp32c3
build_src_filter = +<main_energy.cpp>
build_flags = ${env:esp32c3.build_flags} -DEB_COEFF

[env:megaatmega2560_energy_mlcoeff]
extends = env:megaatmega2560
build_src_filter = +<main_energy.cpp>
build_flags = ${env:megaatmega2560.build_flags} -DEB_MLCOEFF

[env:esp32c3_energy_mlcoeff]
extends = env:esp32c3
build_src_filter = +<main_energy.cpp>
build_flags = ${env:esp32c3.build_flags} -DEB_MLCOEFF

[env:megaatmega2560_energy_e2e]
extends = env:megaatmega2560
build_src_filter = +<main_energy.cpp>
build_flags = ${env:megaatmega2560.build_flags} -DEB_E2E

[env:esp32c3_energy_e2e]
extends = env:esp32c3
build_src_filter = +<main_energy.cpp>
build_flags = ${env:esp32c3.build_flags} -DEB_E2E

[env:megaatmega2560_energy_dt5]
extends = env:megaatmega2560
build_src_filter = +<main_energy.cpp>
build_flags = ${env:megaatmega2560.build_flags} -DEB_DT5

[env:esp32c3_energy_dt5]
extends = env:esp32c3
build_src_filter = +<main_energy.cpp>
build_flags = ${env:esp32c3.build_flags} -DEB_DT5

[env:megaatmega2560_energy_mlp]
extends = env:megaatmega2560
build_src_filter = +<main_energy.cpp>
build_flags = ${env:megaatmega2560.build_flags} -DEB_MLP

[env:esp32c3_energy_mlp]
extends = env:esp32c3
build_src_filter = +<main_energy.cpp>
build_flags = ${env:esp32c3.build_flags} -DEB_MLP

; il multiclasse a 10 classi occupa 8.268 B: solo ESP32-C3, come main_mc.cpp
[env:megaatmega2560_energy_lut14]
extends = env:megaatmega2560
build_src_filter = +<main_energy.cpp>
build_flags = ${env:megaatmega2560.build_flags} -DEB_LUT14

[env:esp32c3_energy_lut14]
extends = env:esp32c3
build_src_filter = +<main_energy.cpp>
build_flags = ${env:esp32c3.build_flags} -DEB_LUT14

[env:esp32c3_energy_mc]
extends = env:esp32c3
build_src_filter = +<main_energy.cpp>
build_flags = ${env:esp32c3.build_flags} -DEB_MC
