name: ADAPT-05 smoke Linux

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ADAPT-05 execution mode"
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - campaign

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match review_extension/provenance/campaign.json exactly.  The
          # archived vector-role trajectory is intentionally checked after
          # numerical head fits, where a patch-level interpreter change can
          # alter optimizer output at a decision boundary.
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: adattamento-drift/review_extension/requirements.txt

      - name: Install pinned environment
        run: python -m pip install -r adattamento-drift/review_extension/requirements.txt

      - name: Run ADAPT-05 and Paper-2 targeted tests
        run: >-
          python -m pytest -q
          adattamento-drift/adapt05_occurrence/test_runner.py
          adattamento-drift/review_extension/test_experiment.py
          adattamento-drift/review_extension/review2/test_runner.py
          adattamento-drift/review_extension/review3/test_matched_memory.py
          adattamento-drift/review_extension/calibration_audit/test_calibration_audit.py
          adattamento-drift/ton_temporal/test_calibrazione_recente.py
          adattamento-drift/ton_temporal/test_soglia.py
          adattamento-drift/ton_temporal/test_replay_validazione_finale.py

      - name: Fetch versioned public mirrors
        run: |
          mkdir -p "$RUNNER_TEMP/adapt05/downloads"
          python adattamento-drift/review_extension/fetch_data.py ton --out "$RUNNER_TEMP/adapt05/downloads"
          python adattamento-drift/review_extension/fetch_data.py unsw --out "$RUNNER_TEMP/adapt05/downloads"

      - name: Reconstruct and verify Paper-2 arrays
        run: |
          python adattamento-drift/review_extension/prepare_data.py ton \
            --raw "$RUNNER_TEMP/adapt05/downloads/ton_raw" \
            --out "$RUNNER_TEMP/adapt05/data/ton"
          python adattamento-drift/review_extension/prepare_data.py unsw \
            --raw "$RUNNER_TEMP/adapt05/downloads/unsw_raw" \
            --out "$RUNNER_TEMP/adapt05/data/unsw"

      - name: Run preregistered 30-block smoke
        run: |
          mkdir -p "$RUNNER_TEMP/adapt05/smoke"
          python adattamento-drift/adapt05_occurrence/runner.py \
            --data "$RUNNER_TEMP/adapt05/data/ton" \
            --dataset ton --seed 42 --salt default --max-blocks 30 \
            --out "$RUNNER_TEMP/adapt05/smoke/ton_seed42_default.json"
          python adattamento-drift/adapt05_occurrence/runner.py \
            --data "$RUNNER_TEMP/adapt05/data/unsw" \
            --dataset unsw --seed 42 --salt default --max-blocks 30 \
            --out "$RUNNER_TEMP/adapt05/smoke/unsw_seed42_default.json"

      - name: Upload smoke reports
        uses: actions/upload-artifact@v4
        with:
          name: adapt05-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/adapt05/smoke/*.json
          if-no-files-found: error
          retention-days: 30

  campaign:
    if: inputs.mode == 'campaign'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: adattamento-drift/review_extension/requirements.txt

      - name: Install pinned environment
        run: python -m pip install -r adattamento-drift/review_extension/requirements.txt

      - name: Run targeted tests
        run: >-
          python -m pytest -q
          adattamento-drift/adapt05_occurrence/test_runner.py
          adattamento-drift/adapt05_occurrence/test_campaign_analysis.py
          adattamento-drift/review_extension/test_experiment.py
          adattamento-drift/review_extension/review2/test_runner.py
          adattamento-drift/review_extension/review3/test_matched_memory.py
          adattamento-drift/review_extension/calibration_audit/test_calibration_audit.py
          adattamento-drift/ton_temporal/test_calibrazione_recente.py
          adattamento-drift/ton_temporal/test_soglia.py
          adattamento-drift/ton_temporal/test_replay_validazione_finale.py

      - name: Fetch versioned public mirrors
        run: |
          mkdir -p "$RUNNER_TEMP/adapt05/downloads"
          python adattamento-drift/review_extension/fetch_data.py ton --out "$RUNNER_TEMP/adapt05/downloads"
          python adattamento-drift/review_extension/fetch_data.py unsw --out "$RUNNER_TEMP/adapt05/downloads"

      - name: Reconstruct and verify Paper-2 arrays
        run: |
          python adattamento-drift/review_extension/prepare_data.py ton \
            --raw "$RUNNER_TEMP/adapt05/downloads/ton_raw" \
            --out "$RUNNER_TEMP/adapt05/data/ton"
          python adattamento-drift/review_extension/prepare_data.py unsw \
            --raw "$RUNNER_TEMP/adapt05/downloads/unsw_raw" \
            --out "$RUNNER_TEMP/adapt05/data/unsw"

      - name: Run frozen 30-cell matrix
        run: |
          python adattamento-drift/adapt05_occurrence/campaign.py \
            --data-root "$RUNNER_TEMP/adapt05/data" \
            --out "$RUNNER_TEMP/adapt05/campaign" --workers 2

      - name: Validate and analyze all results
        run: |
          python adattamento-drift/adapt05_occurrence/analyze.py \
            --reports "$RUNNER_TEMP/adapt05/campaign/reports" \
            --data-root "$RUNNER_TEMP/adapt05/data" \
            --out "$RUNNER_TEMP/adapt05/campaign/analysis"
          cp adattamento-drift/adapt05_occurrence/REPRODUCTION.md \
            "$RUNNER_TEMP/adapt05/campaign/REPRODUCTION.md"
          mkdir -p "$RUNNER_TEMP/adapt05/campaign/source"
          cp adattamento-drift/adapt05_occurrence/{PROTOCOL.md,MATRIX.csv,LOG_SCHEMA.md,README.md,REPRODUCTION.md,runner.py,roles.py,campaign.py,analyze.py,package_campaign.py} \
            "$RUNNER_TEMP/adapt05/campaign/source/"
          cp adattamento-drift/review_extension/requirements.txt \
            "$RUNNER_TEMP/adapt05/campaign/source/requirements.txt"

      - name: Package complete evidence
        run: |
          mkdir -p "$RUNNER_TEMP/adapt05/archive"
          python adattamento-drift/adapt05_occurrence/package_campaign.py \
            --root "$RUNNER_TEMP/adapt05/campaign" \
            --out "$RUNNER_TEMP/adapt05/archive/adapt05_occurrence_full.zip"

      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: adapt05-complete-${{ github.sha }}
          path: |
            ${{ runner.temp }}/adapt05/campaign
            ${{ runner.temp }}/adapt05/archive
          if-no-files-found: error
          retention-days: 30
